name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela una ejecucion en curso del mismo PR/rama cuando llega un push
# nuevo: no tiene sentido terminar de compilar un commit ya superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l encontro ficheros sin formatear:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        # -race exige cgo (y por tanto un compilador de C); en linux-latest
        # esta disponible de serie, en windows-latest no sin instalarlo aparte.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test ./... -race -count=1
          else
            go test ./... -count=1
          fi
        shell: bash

      - name: go build (todos los paquetes)
        run: go build ./...

  cross-compile:
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Agente y servidor para linux/amd64, linux/arm64, windows/amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 ext=$3
            echo "-> ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=ci" \
              -o "dist/fleetpulse-agent-${goos}-${goarch}${ext}" ./cmd/fleetpulse-agent
          }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/fleetpulse-server-linux-amd64 ./cmd/fleetpulse-server

  proto:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
