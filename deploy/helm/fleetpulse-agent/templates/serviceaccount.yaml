apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fleetpulse-agent.name" . }}
  labels:
    {{- include "fleetpulse-agent.labels" . | nindent 4 }}
---
# ClusterRole minima para leer contenedores via la API del kubelet
# (internal/collector/kubelet.go): "nodes/proxy" y "nodes/stats" son lo que
# el kubelet exige para aceptar la peticion autenticada con este token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fleetpulse-agent.name" . }}
  labels:
    {{- include "fleetpulse-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/stats", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fleetpulse-agent.name" . }}
  labels:
    {{- include "fleetpulse-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fleetpulse-agent.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fleetpulse-agent.name" . }}
    namespace: {{ .Release.Namespace }}
