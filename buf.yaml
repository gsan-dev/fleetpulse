version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # MetricPayload y PushMetricsAck son los nombres que fija la especificacion
  # del proyecto, asi que no se renombran al patron Request/Response de buf.
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
